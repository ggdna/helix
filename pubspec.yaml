name: gg_dna
description: The DNA engine - resolves DNA packages declared as dev-dependencies, merges their dna folders and instantiates configs, docs, scripts and agent skills into the target repo.
version: 5.0.0
repository: https://github.com/ggsuite/gg_dna.git

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^2.0.4
  gg_hash: ^1.0.4
  gg_log: ^1.0.6
  path: ^1.9.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
 gg_dna:

# DNA configuration lives in `.gg/dna.json` of the consuming repo
# (all keys optional — see README):
#
# {
#   "role": "project",
#   "order": ["base_dna", "dna_dart"],
#   "vars": { "projectName": "my_project" },
#   "fileNaming": "snake_case",
#   "dependencies": { "base_dna": { "path": "../base_dna" } },
#   "config": {
#     "claude": { "claude_md": { "include": ["doc/conventions"] } }
#   }
# }
