name: helix
description: The DNA engine - resolves DNA packages declared as dev-dependencies, merges their dna folders and instantiates configs, docs, scripts and agent skills into the target repo.
version: 1.3.0
repository: https://github.com/ggsuite/helix.git

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.1.1
  gg_console_colors: ^2.4.0
  gg_hash: ^1.3.0
  gg_json: ^4.2.0
  gg_log: ^1.2.0
  gg_process: ^1.2.0
  path: ^1.9.1
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2

executables:
  helix: