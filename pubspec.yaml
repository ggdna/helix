name: gg_dna
description: Die DNA fuer Programmierprojekte - synchronisiert Anleitungen, Skills und Konventionen fuer KI-Agenten aus mehrschichtigen DNA-Repos in Zielprojekte.
version: 3.0.0
repository: https://github.com/ggsuite/gg_dna.git

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^2.0.4
  gg_console_colors: ^2.1.5
  gg_hash: ^1.0.4
  gg_log: ^1.0.6
  gg_process: ^1.1.6
  path: ^1.9.0
  pub_semver: ^2.1.0
  yaml: ^3.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
 gg_dna:

# Example dna configuration for consuming repos.
# Layers are applied in `order` — later layers win:
#
# dna:
#   order:
#     - dna_company
#     - dna_project
#   dependencies:
#     dna_company:
#       git: https://github.com/acme/dna_company.git
#       version: ^1.4.0
#     dna_project:
#       path: ../dna_project
#   config:
#     claude:
#       claude_md:
#         include:
#           - dna/agents/conventions
#       skills:
#         include:
#           - dna/agents/skills