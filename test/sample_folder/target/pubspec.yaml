name: target_repo
description: Sample target repo consuming a three-layer DNA configuration.
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dna:
  order:
    - dna_company
    - dna_project
    - dna_repo
  dependencies:
    dna_company:
      git: https://github.com/acme/dna_company.git
      version: ^1.4.0
    dna_project:
      path: ../dna_project
    dna_repo:
      path: dna/_override
